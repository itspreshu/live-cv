<section id="stack" class="section-block">
  <header class="section-heading">
    <p class="section-kicker">Stack</p>
    <h2>Tecnologías con las que <em>trabajo</em></h2>
    <p>
      No todas pesan igual en cada proyecto, pero juntas explican bastante bien el tipo de perfil que tengo.
    </p>
  </header>

  <div class="stack-grid">
    <article class="stack-card box" *ngFor="let group of skillGroups">
      <i class="stack-watermark iconoir-{{ group.ghostIcon }}" aria-hidden="true"></i>
      <div class="stack-card-head">
        <span class="stack-icon" aria-hidden="true">
          <i class="iconoir-{{ group.icon }}"></i>
        </span>
        <h3>{{ group.title }}</h3>
      </div>
      <p>{{ group.description }}</p>
      <div class="chip-list">
        <span class="chip" *ngFor="let item of group.items">{{ item }}</span>
      </div>
    </article>
  </div>
</section>
